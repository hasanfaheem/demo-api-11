services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pro_api_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    networks:
      - pro_api_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: pro_api_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pro_api_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: pro_api_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pro_api
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: pro_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pro_api_network

networks:
  pro_api_network:
    driver: bridge

volumes:
  db_data:
  vendor_data: