openapi: 3.0.3
info:
  title: PRO API — Patient Reported Outcomes
  description: RESTful API for managing patient-reported outcome submissions across clinical instruments.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local development server

paths:
  /patients:
    post:
      summary: Create a new patient
      operationId: createPatient
      tags:
        - Patients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePatientRequest'
            example:
              name: Sarah Johnson
              date_of_birth: "1985-03-15"
              mrn: MRN-001-SJ
      responses:
        "201":
          description: Patient created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Patient'
        "422":
          $ref: '#/components/responses/ValidationError'

  /instruments:
    post:
      summary: Create a new instrument with questions
      operationId: createInstrument
      tags:
        - Instruments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreInstrumentRequest'
            example:
              title: Weekly Symptom Tracker
              description: Monitors treatment side effects weekly.
              questions:
                - prompt: Rate your pain level this week.
                  response_type: scale_1_5
                  order: 0
                - prompt: Did you experience nausea?
                  response_type: yes_no
                  order: 1
                - prompt: Describe any other symptoms.
                  response_type: free_text
                  order: 2
      responses:
        "201":
          description: Instrument created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Instrument'
        "422":
          $ref: '#/components/responses/ValidationError'

  /patients/{patientId}/submissions:
    post:
      summary: Submit a completed instrument for a patient
      operationId: createSubmission
      tags:
        - Submissions
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSubmissionRequest'
            example:
              instrument_id: 1
              answers:
                - question_id: 1
                  value: 3
                - question_id: 2
                  value: true
                - question_id: 3
                  value: Mild headache.
      responses:
        "201":
          description: Submission created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Submission'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'

    get:
      summary: List all submissions for a patient
      operationId: listSubmissions
      tags:
        - Submissions
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination
      responses:
        "200":
          description: Paginated list of submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Submission'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "404":
          $ref: '#/components/responses/NotFound'

  /patients/{patientId}/submissions/{submissionId}:
    get:
      summary: Get a single submission with all answers
      operationId: getSubmission
      tags:
        - Submissions
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        "200":
          description: Submission detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Submission'
        "404":
          $ref: '#/components/responses/NotFound'

  /patients/{patientId}/summary:
    get:
      summary: Get aggregated summary of patient responses to a specific instrument
      operationId: getPatientSummary
      tags:
        - Summary
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - name: instrument_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the instrument to summarize
      responses:
        "200":
          description: Aggregated summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Summary'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'

components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: integer
      description: The patient ID

    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: integer
      description: The submission ID

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: No query results for model.

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The given data was invalid.
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  mrn:
                    - A patient with this MRN already exists.

  schemas:
    StorePatientRequest:
      type: object
      required:
        - name
        - date_of_birth
        - mrn
      properties:
        name:
          type: string
          example: Sarah Johnson
        date_of_birth:
          type: string
          format: date
          example: "1985-03-15"
        mrn:
          type: string
          description: Must be unique across all patients
          example: MRN-001-SJ

    StoreInstrumentRequest:
      type: object
      required:
        - title
        - questions
      properties:
        title:
          type: string
          example: Weekly Symptom Tracker
        description:
          type: string
          nullable: true
          example: Monitors treatment side effects weekly.
        questions:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - prompt
              - response_type
            properties:
              prompt:
                type: string
                example: Rate your pain level this week.
              response_type:
                type: string
                enum:
                  - scale_1_5
                  - yes_no
                  - free_text
              order:
                type: integer
                example: 0

    StoreSubmissionRequest:
      type: object
      required:
        - instrument_id
        - answers
      properties:
        instrument_id:
          type: integer
          example: 1
        answers:
          type: array
          items:
            type: object
            required:
              - question_id
              - value
            properties:
              question_id:
                type: integer
                example: 1
              value:
                oneOf:
                  - type: integer
                    minimum: 1
                    maximum: 5
                    description: For scale_1_5 questions
                  - type: boolean
                    description: For yes_no questions
                  - type: string
                    description: For free_text questions

    Patient:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Sarah Johnson
        date_of_birth:
          type: string
          format: date
          example: "1985-03-15"
        mrn:
          type: string
          example: MRN-001-SJ
        created_at:
          type: string
          format: date-time

    Question:
      type: object
      properties:
        id:
          type: integer
          example: 1
        prompt:
          type: string
          example: Rate your pain level this week.
        response_type:
          type: string
          enum:
            - scale_1_5
            - yes_no
            - free_text
        order:
          type: integer
          example: 0

    Instrument:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Weekly Symptom Tracker
        description:
          type: string
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        created_at:
          type: string
          format: date-time

    Answer:
      type: object
      properties:
        question_id:
          type: integer
          example: 1
        prompt:
          type: string
          example: Rate your pain level this week.
        response_type:
          type: string
          enum:
            - scale_1_5
            - yes_no
            - free_text
        value:
          oneOf:
            - type: integer
            - type: boolean
            - type: string

    Submission:
      type: object
      properties:
        id:
          type: integer
          example: 1
        patient_id:
          type: integer
          example: 1
        instrument:
          $ref: '#/components/schemas/Instrument'
        submitted_at:
          type: string
          format: date-time
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        created_at:
          type: string
          format: date-time

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    AggregateResult:
      type: object
      properties:
        type:
          type: string
          enum:
            - average_score
            - yes_percentage
            - non_empty_count
        value:
          oneOf:
            - type: number
            - type: integer
          nullable: true

    SummaryQuestion:
      type: object
      properties:
        question_id:
          type: integer
        prompt:
          type: string
        response_type:
          type: string
        aggregate:
          $ref: '#/components/schemas/AggregateResult'

    Summary:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        total_submissions:
          type: integer
          example: 6
        date_range:
          type: object
          nullable: true
          properties:
            earliest:
              type: string
              format: date-time
            latest:
              type: string
              format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SummaryQuestion'